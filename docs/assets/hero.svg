 font-size="12">Arjun · due Wed · no ticket — nobody would have noticed</text><text x="100" y="356" fill="#b9770e" font-size="13" font-weight="700">DUE THIS WEEK · 1</text><text x="100" y="380" fill="#1d1c1d" font-size="14">Send the final deck to Kelso</text><text x="100" y="398" fill="#6b6a65" font-size="12">Sana · due Wed 21 Oct</text><text x="100" y="434" fill="#1e8449" font-size="13" font-weight="700">PROMISE-KEEPING · 30 DAYS</text><text x="100" y="458" fill="#1d1c1d" font-size="13">Arjun</text><rect width="180" height="10" x="160" y="448" fill="#e6f4ea" rx="5"/><rect width="180" height="10" x="160" y="448" fill="#2e9e5b" rx="5"/><text x="352" y="458" fill="#6b6a65" font-size="12">1 / 1 on time</text><text x="100" y="496" fill="#8a8984" font-size="12">Every promise carries the exact words it came from.</text><g filter="url(#shadow)"><rect width="320" height="236" x="612" y="28" fill="#fff" stroke="#e3e1da" rx="12"/></g><text x="636" y="62" fill="#6b6a65" font-size="13" font-weight="600">Direct message</text><line x1="612" x2="932" y1="78" y2="78" stroke="#eeece6"/><text x="636" y="106" fill="#1d1c1d" font-size="14" font-weight="700">kept</text><text x="636" y="132" fill="#1d1c1d" font-size="13">⏰ Overdue: you said</text><text x="636" y="152" fill="#55544f" font-size="13" font-style="italic">“I&apos;ll chase the July invoice with</text><text x="636" y="170" fill="#55544f" font-size="13" font-style="italic">their finance team tomorrow”</text><text x="636" y="190" fill="#1d1c1d" font-size="13">in #kelso. Due Wed 6:00 PM.</text><rect width="62" height="24" x="636" y="206" fill="#f1f0eb" rx="5"/><text x="667" y="222" fill="#1d1c1d" font-family="ui-monospace, Menlo, monospace" font-size="12" text-anchor="middle">done 3</text><rect width="110" height="24" x="706" y="206" fill="#f1f0eb" rx="5"/><text x="761" y="222" fill="#1d1c1d" font-family="ui-monospace, Menlo, monospace" font-size="12" text-anchor="middle">push 3 to fri</text><rect width="60" height="24" x="824" y="206" fill="#f1f0eb" rx="5"/><text x="854" y="222" fill="#1d1c1d" font-family="ui-monospace, Menlo, monospace" font-size="12" text-anchor="middle">drop 3</text><g filter="url(#shadow)"><rect width="320" height="244" x="612" y="288" fill="#fff" stroke="#e3e1da" rx="12"/></g><text x="636" y="322" fill="#6b6a65" font-size="13" font-weight="600"># kelso · last Tuesday</text><line x1="612" x2="932" y1="338" y2="338" stroke="#eeece6"/><text x="636" y="366" fill="#1d1c1d" font-size="14" font-weight="700">Arjun Mehta</text><text x="636" y="390" fill="#1d1c1d" font-size="13">On it —</text><rect width="190" height="20" x="686" y="376" fill="#fff4cc" rx="4"/><text x="690" y="390" fill="#1d1c1d" font-size="13">I&apos;ll chase the July invoice with</text><rect width="184" height="20" x="632" y="398" fill="#fff4cc" rx="4"/><text x="636" y="412" fill="#1d1c1d" font-size="13">their finance team tomorrow.</text><text x="636" y="452" fill="#6b6a65" font-size="12">↳ caught as a promise: owner Arjun,</text><text x="636" y="470" fill="#6b6a65" font-size="12">due Wed 6 PM, no matching ticket.</text><text x="636" y="500" fill="#8a8984" font-size="12">Nobody filed anything.</text></svg>